name: Materialize MCP uploads
on:
  push:
    branches: [main]
    paths:
      - ".github/payload-uploads/**"
      - ".github/workflows/materialize-mcp-uploads.yml"
permissions:
  contents: write
concurrency:
  group: materialize-mcp
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inflate gzip staging payloads
        run: |
          python3 << 'PY'
          import base64, gzip, hashlib, json, os, pathlib, sys
          from collections import defaultdict
          root = pathlib.Path(".github/payload-uploads")
          if not root.exists():
              print("no payload-uploads")
              sys.exit(0)
          singles = []
          groups = defaultdict(list)
          for p in root.rglob("*.json"):
              obj = json.loads(p.read_text())
              if not isinstance(obj, dict) or "dest" not in obj:
                  print("skip unknown", p)
                  continue
              if "gz_b64" in obj:
                  singles.append((obj, p))
              else:
                  groups[obj["dest"]].append((obj.get("index", 0), obj, p))
          written = []
          def write_dest(dest, data, expected):
              if expected:
                  got = hashlib.sha256(data).hexdigest()
                  if got != expected:
                      print(f"sha mismatch {dest}: {got} != {expected}")
                      return False
              path = pathlib.Path(dest)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f"wrote {dest} ({len(data)} bytes)")
              written.append(dest)
              return True
          for obj, p in singles:
              try:
                  data = gzip.decompress(base64.b64decode(obj["gz_b64"]))
                  if write_dest(obj["dest"], data, obj.get("sha256")):
                      p.unlink()
              except Exception as e:
                  print(f"fail single {obj.get('dest')}: {e}")
          for dest, items in groups.items():
              try:
                  items.sort(key=lambda x: x[0])
                  total = items[0][1]["total"]
                  if len(items) != total:
                      print(f"skip {dest}: {len(items)}/{total}")
                      continue
                  b64 = "".join(x[1]["b64"] for x in items)
                  data = gzip.decompress(base64.b64decode(b64))
                  if write_dest(dest, data, items[0][1].get("sha256")):
                      for _, _, p in items:
                          p.unlink()
              except Exception as e:
                  print(f"fail chunked {dest}: {e}")
          for dirpath, dirnames, filenames in os.walk(root, topdown=False):
              if not os.listdir(dirpath):
                  os.rmdir(dirpath)
          print("done", written)
          PY
      - name: Commit materialized files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore: materialize MCP-uploaded large files"
          git push origin HEAD:main
          OTHER=cursor/standalone-desktop-app-1f95
          if git ls-remote --heads origin "$OTHER" | grep -q .; then
            git fetch origin "$OTHER"
            git checkout -B "$OTHER" "origin/$OTHER"
            for f in worker/src/db/repos.ts worker/src/db/repos.test.ts scripts/uat-local.ts database/seeds/synthetic/demo-dataset.json frontend/public/demo-dataset.json package-lock.json; do
              if git cat-file -e "main:$f" 2>/dev/null; then
                git checkout main -- "$f"
              fi
            done
            git add -A
            if git diff --cached --quiet; then
              echo "feature branch already has files"
            else
              git commit -m "chore: materialize MCP-uploaded large files"
              git push origin "HEAD:$OTHER"
            fi
          fi
